<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amin Bazyar - Machine Learning Engineer</title>
<meta name="description" content="Portfolio of Amin Bazyar, Machine Learning Engineer: computer vision, Persian NLP, LLMs and RAG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec;--card:#fffdf8;--ink:#14182b;--mute:#575d78;
  --accent:#5b3fd6;--on:#fff;--accent2:#a97c12;--line:#dcd5c3;--pt:#5b3fd6;--ln:#9d8ee8;
  --display:'Fraunces',Georgia,serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0a1128;--card:#101a3a;--ink:#e8ebf5;--mute:#9aa3c2;--accent:#e0b458;--on:#1a1405;--accent2:#8b6cf0;--line:#26315a;--pt:#e0b458;--ln:#8b6cf0}
}
:root[data-theme="dark"]{--bg:#0a1128;--card:#101a3a;--ink:#e8ebf5;--mute:#9aa3c2;--accent:#e0b458;--on:#1a1405;--accent2:#8b6cf0;--line:#26315a;--pt:#e0b458;--ln:#8b6cf0}
html[lang="fa"]{--display:'Vazirmatn','Segoe UI',Tahoma,sans-serif;--body:'Vazirmatn','Segoe UI',Tahoma,sans-serif}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--body)}
html[lang="fa"] body{line-height:2}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:22px;align-items:center;overflow-x:auto;height:54px;white-space:nowrap}
nav b{font:700 18px var(--display);margin-inline-end:auto}
nav a{color:var(--mute);font-size:15px}
#lang{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:4px 14px;font:500 14px var(--body);cursor:pointer}
#hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
#c{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:64px}
h1{font:700 clamp(44px,8vw,84px)/1 var(--display);margin:0 0 14px;letter-spacing:-.025em}
html[lang="fa"] h1{letter-spacing:0;line-height:1.3}
.role{font:600 clamp(20px,3.4vw,28px)/1.35 var(--display);color:var(--accent);margin:0 0 18px}
.sub{color:var(--mute);max-width:46ch;margin:0 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:11px 22px;border-radius:999px;font-weight:500;border:1px solid var(--accent);color:var(--accent)}
.btn.fill{background:var(--accent);color:var(--on)}
.btn:hover{text-decoration:none;opacity:.88}
.me{width:100%;max-width:340px;aspect-ratio:3/4;object-fit:cover;border-radius:20px;border:1px solid var(--line);outline:2px solid var(--accent2);outline-offset:9px;justify-self:center;background:var(--card)}
section{padding:72px 0;border-bottom:1px solid var(--line)}
h2{font:700 34px/1.2 var(--display);margin:0 0 28px}
p{margin:0 0 14px;max-width:66ch}
.row{display:grid;grid-template-columns:1fr 2fr;gap:8px 40px;padding:24px 0;border-top:1px solid var(--line)}
.row:last-of-type{border-bottom:1px solid var(--line)}
.row h3{font:700 21px/1.35 var(--display);margin:0}
.row p{color:var(--mute);margin:0 0 6px}
.tags{color:var(--accent2);font-size:14px;direction:ltr;text-align:start}
html[dir="rtl"] .tags{text-align:right}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:30px}
.skills h3{font:700 19px var(--display);margin:0 0 8px;color:var(--accent)}
.skills p{color:var(--mute);margin:0}
.links{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:8px}
.ltr{direction:ltr;unicode-bidi:embed}
footer{padding:34px 0;color:var(--mute);font-size:14px}
.dl{display:inline-block;margin-top:6px;font-size:15px;font-weight:500}
.fb{font:700 21px var(--display);margin:40px 0 8px}
form label{display:block;margin-bottom:16px;max-width:560px}
form label span{display:block;margin-bottom:6px;font-size:15px;color:var(--mute)}
form input[type=text],form input[type=email],form textarea{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit}
form input:focus,form textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
form button.btn{font:inherit;font-weight:500;cursor:pointer}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#fbs{margin-top:14px;color:var(--mute)}
@media (max-width:720px){
  .hero-grid{grid-template-columns:1fr;padding-top:40px}
  .me{order:-1;max-width:230px;justify-self:start}
  .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
#err{padding:24px;color:#b3261e}
</style>
</head>
<body>
<nav><div class="wrap">
  <b data-k="name"></b>
  <a href="#about" data-k="nav.about"></a>
  <a href="#projects" data-k="nav.projects"></a>
  <a href="#skills" data-k="nav.skills"></a>
  <a href="#resume" data-k="nav.resume"></a>
  <a href="#contact" data-k="nav.contact"></a>
  <button id="lang" type="button" aria-label="Switch language" data-k="toggle"></button>
</div></nav>
<div id="err" hidden></div>

<header id="hero">
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="wrap hero-grid">
    <div>
      <h1 data-k="name"></h1>
      <p class="role" data-k="role"></p>
      <p class="sub" data-k="sub"></p>
      <div class="btns">
        <a class="btn fill" href="#projects" data-k="cta1"></a>
        <a class="btn" href="#contact" data-k="cta2"></a>
      </div>
    </div>
    <img class="me" src="me.jpg" alt="Amin Bazyar" width="340" height="453">
  </div>
</header>

<section id="about"><div class="wrap">
  <h2 data-k="aboutH"></h2>
  <p data-k="about1"></p>
  <p data-k="about2"></p>
</div></section>

<section id="projects"><div class="wrap">
  <h2 data-k="projectsH"></h2>
  <div id="plist"></div>
  <p id="more" style="margin-top:18px"></p>
</div></section>

<section id="skills"><div class="wrap">
  <h2 data-k="skillsH"></h2>
  <div class="skills" id="slist"></div>
</div></section>

<section id="resume"><div class="wrap">
  <h2 data-k="resumeH"></h2>
  <p data-k="resumeP"></p>
  <a class="btn fill" href="resume.pdf" download data-k="resumeBtn"></a>
</div></section>

<section id="contact"><div class="wrap">
  <h2 data-k="contactH"></h2>
  <p data-k="contactP"></p>
  <div class="links">
    <a class="ltr" id="mail" href="#"></a>
    <a class="gh" href="#" target="_blank" rel="noopener">GitHub</a>
    <a class="li" href="#" target="_blank" rel="noopener">LinkedIn</a>
  </div>
  <h3 class="fb" data-k="fbH"></h3>
  <p data-k="fbP"></p>
  <form id="fb">
    <label><span data-k="fbName"></span><input type="text" name="name" autocomplete="name"></label>
    <label><span data-k="fbEmail"></span><input type="email" name="email" autocomplete="email" dir="ltr" required></label>
    <label><span data-k="fbMsg"></span><textarea name="message" rows="5" required></textarea></label>
    <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="btn fill" type="submit" data-k="fbSend"></button>
    <p id="fbs" role="status"></p>
  </form>
</div></section>

<footer><div class="wrap" data-k="name"></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var root=document.documentElement,C=null,lang='en';
  var $=function(s){return document.querySelector(s);};
  function g(path){return path.split('.').reduce(function(o,k){return o&&o[k];},C);}
  function t(o){return o?(o[lang]||o.en||''):'';}
  function mk(tag,cls,txt){var e=document.createElement(tag);if(cls){e.className=cls;}if(txt!==undefined){e.textContent=txt;}return e;}

  function load(){return fetch('content.json',{cache:'no-cache'}).then(function(r){return r.json();});}

  function render(){
    document.querySelectorAll('[data-k]').forEach(function(el){el.textContent=t(g(el.getAttribute('data-k')));});
    document.title=t(C.title);
    var pl=$('#plist');pl.textContent='';
    C.projects.forEach(function(p){
      var row=mk('div','row'),box=mk('div');
      row.appendChild(mk('h3','',t(p.name)));
      box.appendChild(mk('p','',t(p.desc)));
      box.appendChild(mk('div','tags',p.tags));
      if(p.zip){var a=mk('a','dl',t(C.dl));a.href='downloads/'+p.zip+'.zip';a.setAttribute('download','');box.appendChild(a);}
      row.appendChild(box);pl.appendChild(row);
    });
    var sl=$('#slist');sl.textContent='';
    C.skills.forEach(function(s){
      var d=mk('div');d.appendChild(mk('h3','',t(s.h)));d.appendChild(mk('p','',t(s.p)));sl.appendChild(d);
    });
    var m=$('#more');m.textContent='';
    m.appendChild(document.createTextNode(t(C.moreBefore)));
    var gh=mk('a','','GitHub');gh.href=C.github;gh.target='_blank';gh.rel='noopener';m.appendChild(gh);
    m.appendChild(document.createTextNode(t(C.moreAfter)));
    document.querySelectorAll('.gh').forEach(function(a){a.href=C.github;});
    document.querySelectorAll('.li').forEach(function(a){a.href=C.linkedin;});
    var ml=$('#mail');ml.href='mailto:'+C.email;ml.textContent=C.email;
  }
  function setLang(l){
    lang=l;root.lang=l;root.dir=(l==='fa')?'rtl':'ltr';
    try{localStorage.setItem('lang',l);}catch(e){}
    render();
  }
  $('#lang').addEventListener('click',function(){setLang(lang==='fa'?'en':'fa');});

  var f=$('#fb'),st=$('#fbs');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var d=new FormData(f);
    if(C.formEndpoint.indexOf('YOUR_FORM_ID')>-1){
      var body='From: '+(d.get('name')||'')+' <'+d.get('email')+'>\n\n'+d.get('message');
      window.location.href='mailto:'+C.email+'?subject='+encodeURIComponent('Portfolio feedback')+'&body='+encodeURIComponent(body);
      return;
    }
    st.textContent=t(C.fbWait);
    fetch(C.formEndpoint,{method:'POST',body:d,headers:{'Accept':'application/json'}})
      .then(function(r){if(r.ok){f.reset();st.textContent=t(C.fbOk);}else{st.textContent=t(C.fbErr);}})
      .catch(function(){st.textContent=t(C.fbErr);});
  });

  load().then(function(j){
    C=j;
    var saved=null;try{saved=localStorage.getItem('lang');}catch(e){}
    setLang(saved==='fa'?'fa':'en');
  }).catch(function(){
    var er=$('#err');er.hidden=false;
    er.textContent='content.json could not be loaded. Open the site through a local server (VS Code Live Server) or after uploading it to the host.';
  });
})();
</script>
<script>
(function(){
var root=document.documentElement;
if(!window.THREE){return;}
  var hero=document.getElementById('hero');
  var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(55,1,0.1,100);camera.position.z=14;
  var group=new THREE.Group();scene.add(group);
  function cv(n){return getComputedStyle(root).getPropertyValue(n).trim();}

  var N=80,pts=[],pos=new Float32Array(N*3),i,j;
  for(i=0;i<N;i++){
    var r=4+Math.random()*5,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);
    var v=new THREE.Vector3(r*Math.sin(p)*Math.cos(t)*1.5,r*Math.sin(p)*Math.sin(t)*0.7,r*Math.cos(p));
    pts.push(v);pos[i*3]=v.x;pos[i*3+1]=v.y;pos[i*3+2]=v.z;
  }
  var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var pm=new THREE.PointsMaterial({color:cv('--pt'),size:0.17});
  group.add(new THREE.Points(pg,pm));
  var lp=[];
  for(i=0;i<N;i++)for(j=i+1;j<N;j++){
    if(pts[i].distanceTo(pts[j])<3.4){lp.push(pts[i].x,pts[i].y,pts[i].z,pts[j].x,pts[j].y,pts[j].z);}
  }
  var lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
  var lm=new THREE.LineBasicMaterial({color:cv('--ln'),transparent:true,opacity:0.5});
  group.add(new THREE.LineSegments(lg,lm));

  function recolor(){pm.color.set(cv('--pt'));lm.color.set(cv('--ln'));}
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener){mq.addEventListener('change',recolor);}

  function resize(){
    var w=hero.clientWidth,h=hero.clientHeight;
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  }
  window.addEventListener('resize',resize);resize();
  if(window.ResizeObserver){new ResizeObserver(resize).observe(hero);}

  var mx=0,my=0;
  window.addEventListener('pointermove',function(e){mx=e.clientX/window.innerWidth-0.5;my=e.clientY/window.innerHeight-0.5;});
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(){
    if(!still){group.rotation.y+=0.0018;}
    group.rotation.x+=((my*0.4)-group.rotation.x)*0.03;
    group.rotation.z+=((mx*0.25)-group.rotation.z)*0.03;
    renderer.render(scene,camera);
    requestAnimationFrame(tick);
  }
  tick();

})();
</script>
</body>
</html>
